name: ${COMPOSE_PROJECT_NAME:-kobo-nextgen}

services:
  kpi:
    image: "${KPI_IMAGE:-kobotoolbox/kpi:2.026.33a}"
    init: true
    env_file: [../runtime/kobo.env]
    depends_on:
      preflight: {condition: service_completed_successfully}
      redis-cache: {condition: service_healthy}
    volumes:
      - ../runtime/static:/srv/static
      - ../runtime/logs/kpi:/srv/logs
      - ../runtime/media-mount/kpi:/srv/src/kpi/media
      - ../runtime/media-mount/kobocat:/srv/src/kobocat/media
      - ../scripts/wait_for_mongo.sh:/srv/init/wait_for_mongo.bash:ro
      - ../scripts/wait_for_postgres.sh:/srv/init/wait_for_postgres.bash:ro
    networks: [kobo-internal]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m

  worker:
    extends: {service: kpi}
    command: [bash, /srv/src/kpi/docker/entrypoint_celery_kpi_worker.bash]
    depends_on: {kpi: {condition: service_healthy}}
    healthcheck: {disable: true}
  worker-low:
    extends: {service: kpi}
    command: [bash, /srv/src/kpi/docker/entrypoint_celery_kpi_worker_low_priority.bash]
    depends_on: {kpi: {condition: service_healthy}}
    healthcheck: {disable: true}
  worker-long:
    extends: {service: kpi}
    command: [bash, /srv/src/kpi/docker/entrypoint_celery_kpi_worker_long_running_tasks.bash]
    depends_on: {kpi: {condition: service_healthy}}
    healthcheck: {disable: true}
  worker-kobocat:
    extends: {service: kpi}
    command: [bash, /srv/src/kpi/docker/entrypoint_celery_kobocat_worker.bash]
    depends_on: {kpi: {condition: service_healthy}}
    healthcheck: {disable: true}
  beat:
    extends: {service: kpi}
    command: [bash, /srv/src/kpi/docker/entrypoint_celery_beat.bash]
    depends_on: {kpi: {condition: service_healthy}}
    healthcheck: {disable: true}

  enketo:
    image: "${ENKETO_IMAGE:-kobotoolbox/enketo-express-extra-widgets:7.6.3}"
    init: true
    env_file: [../runtime/enketo.env]
    depends_on:
      redis-cache: {condition: service_healthy}
    volumes:
      - ../runtime/config/enketo/config.json:/srv/src/enketo/packages/enketo-express/config/config.json:ro
    networks: [kobo-internal]
    restart: unless-stopped

  nginx:
    image: "${NGINX_IMAGE:-nginx:1.27}"
    depends_on: [kpi, enketo]
    env_file: [../runtime/kobo.env]
    volumes:
      - ../runtime/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../runtime/static:/srv/www:ro
      - ../runtime/media-mount/kobocat:/media:ro
      - ../runtime/media-mount/kpi:/srv/kpi_media:ro
      - ../runtime/logs/nginx:/var/log/nginx
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_BIND_PORT:-8080}:80"
    networks:
      kobo-internal:
        aliases:
          - "${KOBOFORM_PUBLIC_SUBDOMAIN:-kf}.${INTERNAL_DOMAIN_NAME:-kobo.internal}"
          - "${KOBOCAT_PUBLIC_SUBDOMAIN:-kc}.${INTERNAL_DOMAIN_NAME:-kobo.internal}"
          - "${ENKETO_PUBLIC_SUBDOMAIN:-ee}.${INTERNAL_DOMAIN_NAME:-kobo.internal}"
          - "${KOBOFORM_DOCKER_ALIAS:-kf.localhost}"
          - "${KOBOCAT_DOCKER_ALIAS:-kc.localhost}"
          - "${ENKETO_DOCKER_ALIAS:-ee.localhost}"
      newt-edge:
        aliases: [kobo-nginx]
    restart: unless-stopped

  redis-cache:
    image: "${REDIS_IMAGE:-redis:7.2}"
    command: [redis-server, --requirepass, "${REDIS_CACHE_PASSWORD}"]
    healthcheck:
      test: [CMD, redis-cli, -a, "${REDIS_CACHE_PASSWORD}", ping]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redis-cache:/data]
    networks: [kobo-internal]
    restart: unless-stopped

  redis-main:
    image: "${REDIS_IMAGE:-redis:7.2}"
    profiles: [local-redis-main]
    command: [redis-server, --appendonly, yes, --requirepass, "${REDIS_MAIN_PASSWORD}"]
    healthcheck:
      test: [CMD, redis-cli, -a, "${REDIS_MAIN_PASSWORD}", ping]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redis-main:/data]
    networks: [kobo-internal]
    restart: unless-stopped

  cloud-sql-proxy:
    profiles: [cloud-sql]
    image: "${CLOUD_SQL_PROXY_IMAGE}"
    command: ["--address=0.0.0.0", "--port=5432", "--structured-logs", "--credentials-file=/secrets/service-account.json", "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}"]
    volumes: [../runtime/secrets/google:/secrets:ro]
    networks: [kobo-internal]
    restart: unless-stopped

  postgres-local:
    image: "${POSTGRES_IMAGE:-postgis/postgis:14-3.2}"
    profiles: [local-db]
    env_file: [../runtime/kobo.env]
    environment:
      POSTGRES_DB: postgres
    volumes:
      - postgres-local:/var/lib/postgresql/data
      - ../scripts/init-local-postgres.sh:/docker-entrypoint-initdb.d/00-kobo.sh:ro
    networks: [kobo-internal]
    restart: unless-stopped

  mongo-local:
    image: "${MONGO_IMAGE:-mongo:8.0}"
    profiles: [local-db]
    env_file: [../runtime/kobo.env]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-kobo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-CHANGE_ME}
      MONGO_INITDB_DATABASE: formhub
    volumes: [mongo-local:/data/db]
    networks: [kobo-internal]
    restart: unless-stopped

  gcsfuse:
    image: "${GCS_FUSE_IMAGE:-kobo-nextgen/gcsfuse:local}"
    build: ../images/gcsfuse
    privileged: true
    cap_add: [SYS_ADMIN]
    devices: [/dev/fuse:/dev/fuse]
    command: [bash, /opt/nextgen/gcsfuse-mount.sh]
    environment:
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      GCS_MOUNT_PATH: /mnt/media
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
    volumes:
      - ../runtime/media-mount:/mnt/media:rshared
      - ../runtime/secrets/google:/secrets:ro
      - ../scripts/gcsfuse-mount.sh:/opt/nextgen/gcsfuse-mount.sh:ro
    networks: [kobo-internal]
    profiles: [gcsfuse]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, mountpoint -q /mnt/media]
      interval: 5s
      timeout: 3s
      retries: 30

  preflight:
    image: "${PREFLIGHT_IMAGE:-debian:bookworm-slim}"
    command: [bash, /opt/nextgen/preflight.sh]
    env_file: [../runtime/kobo.env]
    volumes:
      - ../runtime/media-mount:/media
      - ../scripts/preflight.sh:/opt/nextgen/preflight.sh:ro
    networks: [kobo-internal]
    restart: "no"

volumes:
  redis-cache:
  redis-main:
  postgres-local:
  mongo-local:

networks:
  kobo-internal:
    driver: bridge
  newt-edge:
    external: ${NEWT_NETWORK_EXTERNAL:-false}
    name: ${NEWT_DOCKER_NETWORK:-newt}
