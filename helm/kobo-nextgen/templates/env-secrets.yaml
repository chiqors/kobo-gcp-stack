apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kobo.fullname" . }}-kobo-env
  labels:
    {{- include "kobo.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $line := splitList "\n" .Values.config.koboEnv }}
  {{- if and $line (not (hasPrefix "#" $line)) }}
  {{- $parts := regexSplit "=" $line 2 }}
  {{ index $parts 0 }}: {{ join "=" (rest $parts) | quote }}
  {{- end }}
{{- end }}
